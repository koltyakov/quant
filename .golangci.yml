version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - gosec
      # staticcheck does not model t.Fatal as terminating, so every
      # `if x == nil { t.Fatal(...) }` guard followed by a dereference is
      # reported as a possible nil dereference. The guards are correct.
      - path: '(.+)_test\.go'
        text: 'SA5011'
        linters:
          - staticcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
